[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "colibri-engine"
dynamic = ["version"]
description = "Tiny engine, immense model — run GLM-5.2 (744B MoE) locally"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    {name = "JustVugg"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
convert = [
    "numpy",
    "huggingface_hub",
]
oracle = [
    "torch>=2.0",
    "transformers>=4.40",
    "safetensors",
]
bench = [
    "tokenizers",
    "datasets",
]
vision = [   # pictures through the gateway (the towers' preprocessors)
    "numpy",
    "pillow",
]
agent = [    # Qwen3.6-35B-A3B LangGraph internet research, multimodal & System-1/2 agent
    "langgraph>=0.2.0",
    "langchain-openai>=0.2.0",
    "langchain-core>=0.3.0",
    "langchain-experimental>=0.0.60",
    "duckduckgo-search>=6.0.0",
    "trafilatura>=1.8.0",
    "pytesseract>=0.3.10",
    "Pillow>=10.0.0",
    "openai-whisper>=20231117",
    "edge-tts>=6.1.12",
    "chromadb>=0.5.0",
    "sentence-transformers>=3.0.0",
]
companion = [ # Full Desktop Holographic AI Companion suite
    "langgraph>=0.2.0",
    "langchain-openai>=0.2.0",
    "langchain-core>=0.3.0",
    "langchain-experimental>=0.0.60",
    "duckduckgo-search>=6.0.0",
    "trafilatura>=1.8.0",
    "pytesseract>=0.3.10",
    "Pillow>=10.0.0",
    "openai-whisper>=20231117",
    "edge-tts>=6.1.12",
    "chromadb>=0.5.0",
    "sentence-transformers>=3.0.0",
]

[project.scripts]
coli = "colibri.cli:main"
coli-agent = "src.ai.cli:main"

[project.urls]
Homepage = "https://github.com/JustVugg/colibri"
Issues = "https://github.com/JustVugg/colibri/issues"

[tool.setuptools.dynamic]
version = {attr = "colibri._version.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["colibri*", "src*"]
